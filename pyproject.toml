[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "one-person-ai-commerce"
version = "0.1.0"
description = "Human-supervised AI commerce experimentation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "httpx>=0.27",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/commerce"]
